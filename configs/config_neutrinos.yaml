name: neutrinos_variation

paths:
    # Add below the directory of the project.
    # Rest of the paths are relative but might need to be changed for specific cases.
    project: &projectpath /Users/sergipadilla/IFAE/CS_Fisher
    output:
        fisher_matrix: !join [*projectpath, output]
        figures: !join [*projectpath, figures]

# Sergi
# Add neutrino mass to Cosmology
cosmology:
    Omega_m: 0.315
    Omega_b: 0.049
    h: 0.674
    A_s: 2.0989e-9
    n_s: 0.965
    w0: -1
    wa: 0
    m_nu: 0.06

# Sergi 
# For non-degenerate neutrino masses, ex: m_nu=[0.02,0.03,0.04], mass_split='list', NOT AVAILABLE yet
neutrinos: 
    mass_split: 'equal'

baryons:
    logT_AGN:

IA:
    A_IA: 1.0
    eta:

derivatives:
    validation: [Omega_m,A_s]
    stencil_points: 3
    step_size:
        Omega_m: 0.0045
        Omega_b: 0.002
        h: 0.002
        A_s: 0.004
        n_s: 0.002
        w0: #0.002
        wa: #0.002
        A_IA: 0.0015 
        eta: #0.002
        delta_z: 0.002 
        # Sergi
        m_nu: 0.004
        

ell_binning:
    cosmic_shear:
        bin_start: 20 
        bin_end: 15001
        N_bins: 20
        ell_min: 100 
        ell_max: 3000

forecast:
    fsky: 0.4
    e_rms: 0.26
    year: 1
    z_min: 0.1
    z_max: 4.
    N_z_values: 400

sampling_validation:
    Omega_m:
    Omega_b:
    h:
    sigma8:
    n_s:
    w0:
    wa:
    logT_AGN:
    A_IA:
    delta_z:
    # Sergi
    m_nu: